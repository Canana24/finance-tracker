<aside class="sidebar">

  <div class="sidebar__brand">
    <span class="sidebar__brand-name">Finance Tracker</span>
  </div>

  <nav class="sidebar__nav">
    @for (item of navigationItems; track item.route) {
      <a [routerLink]="item.route" routerLinkActive="sidebar__link--active" class="sidebar__link">
        <lucide-icon [img]="iconMap[item.icon]" [size]="20" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar__footer">
    <app-theme-toggle />
    <button type="button" class="sidebar__logout" (click)="logout()">
      <lucide-icon [img]="logoutIcon" [size]="20" />
      <span>Salir</span>
    </button>
  </div>

</aside>
